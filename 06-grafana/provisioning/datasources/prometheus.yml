apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus                    # 대시보드 JSON 에서 이 uid 로 참조한다
    type: prometheus
    access: proxy                      # Grafana 서버가 대신 조회 (브라우저 → Grafana → Prometheus)
    url: http://prometheus:9090        # compose 서비스 이름으로 접근
    isDefault: true
