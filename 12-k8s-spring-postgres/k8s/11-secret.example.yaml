# 예시 파일이다. 실제 비밀번호를 적어서 커밋하지 않는다.
# 실습에서는 아래 명령으로 클러스터에 직접 만든다 (값이 파일에 남지 않는다):
#   kubectl -n memo create secret generic memo-secret --from-literal=POSTGRES_PASSWORD='원하는-비밀번호'
apiVersion: v1
kind: Secret
metadata:
  name: memo-secret
  namespace: memo
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
