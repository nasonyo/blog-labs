global:
  scrape_interval: 15s       # 15초마다 메트릭 수집

scrape_configs:
  # 1) Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 2) node-exporter: 서버(리눅스) 리소스 메트릭
  #    컨테이너 안에서 localhost 는 자기 자신이므로 서비스 이름으로 접근한다
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
