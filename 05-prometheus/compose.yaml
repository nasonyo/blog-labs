services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # 설정 파일 (읽기 전용)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 수집한 데이터 보존용 named volume
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d   # 데이터 보관 기간
    extra_hosts:
      # 컨테이너 안에서 호스트(내 로컬 머신)에 접근하기 위한 이름
      # Docker Desktop 은 기본 제공, Linux 는 이 설정이 있어야 동작
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
