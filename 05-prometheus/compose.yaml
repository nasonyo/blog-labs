services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # 설정 파일 (읽기 전용)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 수집한 데이터 보존용 named volume
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d   # 데이터 보관 기간
    depends_on:
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    # 호스트에 포트를 열지 않는다. 같은 compose 네트워크에서 node-exporter:9100 으로 접근
    expose:
      - "9100"

volumes:
  prometheus-data:
