# [실습용 구성] 운영 환경에서 그대로 쓰면 안 된다.
#  - Jenkins 가 root 로 실행되고 호스트의 docker.sock 을 마운트한다 (호스트 Docker 를 사실상 root 로 제어)
#  - kubeconfig 에는 클러스터 관리자 인증서가 들어 있다 (Jenkins 가 클러스터 전체를 제어할 수 있다)
#  - 관리자 계정 기본값이 admin / admin 이다
services:
  jenkins:
    build: ./jenkins
    image: lab-jenkins-k8s:2.541.3
    container_name: jenkins-k8s
    user: root
    ports:
      - "9080:8080"            # 8080 은 kind 의 NodePort 매핑(앱)이 쓴다
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JOB_REPO_URL: ${JOB_REPO_URL:-https://github.com/nasonyo/blog-labs.git}
      KUBECONFIG: /var/jenkins_home/.kube/config
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kubeconfig:/var/jenkins_home/.kube/config:ro   # kind get kubeconfig --internal 로 만든 파일
    networks:
      - kind                   # kind 클러스터와 같은 도커 네트워크 (노드 이름으로 접근)

networks:
  kind:
    external: true

volumes:
  jenkins-home:
