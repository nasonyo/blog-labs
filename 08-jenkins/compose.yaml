# [실습용 구성] 아래 설정은 로컬 학습 목적이며 운영 환경에서 그대로 쓰면 안 된다.
#  - Jenkins 가 root 로 실행되고, 호스트의 /var/run/docker.sock 을 마운트한다
#    (= Jenkins 에서 실행되는 코드가 호스트 Docker 를 사실상 root 권한으로 제어할 수 있다)
#  - 관리자 계정 기본값이 admin / admin 이다
services:
  jenkins:
    build: ./jenkins
    image: lab-jenkins:2.541.3
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JOB_REPO_URL: ${JOB_REPO_URL:-https://github.com/nasonyo/blog-labs.git}
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # 호스트 Docker 데몬 사용 (실습용)
    networks:
      - cicd

networks:
  cicd:
    name: cicd-net        # 배포되는 앱 컨테이너도 이 네트워크에 붙여서 이름으로 접근한다

volumes:
  jenkins-home:
