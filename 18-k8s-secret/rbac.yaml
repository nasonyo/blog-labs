# secret 을 읽을 수 있는 계정(reader)과 읽을 수 없는 계정(nobody)을 만든다.
apiVersion: v1
kind: ServiceAccount
metadata: {name: reader, namespace: secret-lab}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: nobody, namespace: secret-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: secret-reader, namespace: secret-lab}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: reader-binding, namespace: secret-lab}
subjects:
  - {kind: ServiceAccount, name: reader, namespace: secret-lab}
roleRef: {kind: Role, name: secret-reader, apiGroup: rbac.authorization.k8s.io}
