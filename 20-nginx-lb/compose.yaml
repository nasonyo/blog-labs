# 백엔드 3대(whoami)와 그 앞의 Nginx 로드밸런서
services:
  app1:
    image: traefik/whoami:v1.10.3
    hostname: app1        # 응답에 찍히는 서버 이름
  app2:
    image: traefik/whoami:v1.10.3
    hostname: app2
  app3:
    image: traefik/whoami:v1.10.3
    hostname: app3
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2, app3]
