log_format lb '$request status=$status upstream=$upstream_addr';

upstream backend {
    zone backend 64k;      # 워커들이 상태를 공유한다
    server app1:80 weight=3;   # app1 이 3배 더 받는다
    server app2:80;
    server app3:80;
}

server {
    listen 80;
    access_log /dev/stdout lb;

    location / {
        proxy_pass http://backend;
    }
}
