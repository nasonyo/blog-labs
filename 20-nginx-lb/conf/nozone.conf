# 어느 서버가 응답했는지 로그에 남긴다
log_format lb '$request status=$status upstream=$upstream_addr';

upstream backend {
    # zone 이 없다: 워커 프로세스마다 라운드 로빈 상태를 따로 가진다
    server app1:80;
    server app2:80;
    server app3:80;
}

server {
    listen 80;
    access_log /dev/stdout lb;

    location / {
        proxy_pass http://backend;
    }
}
